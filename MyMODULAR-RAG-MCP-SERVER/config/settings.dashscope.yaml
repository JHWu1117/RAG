# DashScope acceptance configuration using its OpenAI-compatible endpoint.
# The API key is intentionally not stored here. Set OPENAI_API_KEY only in the
# current process from the user-owned credential file before invoking commands.

llm:
  provider: "openai"
  model: "qwen-plus"
  base_url: "https://ws-oyjkfo9nynmp2tv6.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  temperature: 0.0
  max_tokens: 512

embedding:
  provider: "openai"
  model: "text-embedding-v4"
  dimensions: 1024
  base_url: "https://ws-oyjkfo9nynmp2tv6.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"

vision_llm:
  enabled: true
  provider: "openai"
  model: "qwen-vl-max"
  base_url: "https://ws-oyjkfo9nynmp2tv6.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  max_image_size: 1600

vector_store:
  provider: "chroma"
  persist_directory: "./data/acceptance/chroma"
  collection_name: "acceptance_2025_reports"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: "none"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

evaluation:
  enabled: true
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/acceptance_traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 10
  chunk_refiner:
    use_llm: true
  metadata_enricher:
    use_llm: true
