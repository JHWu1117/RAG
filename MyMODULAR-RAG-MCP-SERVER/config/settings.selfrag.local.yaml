# Local Self-RAG build/runtime profile. Credentials stay in environment variables.

llm:
  provider: "transformers_local"
  model: "artifacts/models/Qwen3-4B"
  temperature: 0.0
  max_tokens: 512
  local_files_only: true
  device_map: "auto"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  compute_dtype: "bfloat16"
  # Reflection labels are judgments only; retry/rewrite/abstention stay in policy.
  enable_thinking: false

embedding:
  provider: "openai"
  # text-embedding-v4 was probed first but is unavailable to this workspace.
  model: "qwen3.7-text-embedding"
  dimensions: 1024
  base_url: "https://ws-oyjkfo9nynmp2tv6.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"

vision_llm:
  enabled: true
  provider: "openai"
  model: "qwen3.5-ocr"
  base_url: "https://ws-oyjkfo9nynmp2tv6.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  max_image_size: 1600

vector_store:
  provider: "chroma"
  persist_directory: "./data/selfrag/chroma"
  collection_name: "selfrag_tencent"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: true
  provider: "cross_encoder"
  model: "artifacts/models/bge-reranker-v2-m3"
  top_k: 8

evaluation:
  enabled: true
  provider: "custom"
  metrics: ["hit_rate", "mrr"]

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/selfrag_traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 10
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
